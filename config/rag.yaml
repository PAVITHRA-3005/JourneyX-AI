corpus_version: v1
chunking:
  winner: structure_aware
  experiments:
    - name: structure_aware
      strategy: structure_aware
      max_chunk_chars: 1200
    - name: fixed_512
      strategy: fixed
      chunk_size: 512
      overlap: 64
retrieval:
  bm25_top_k: 20
  dense_top_k: 20
  fused_top_k: 20
  rerank_top_k: 5
  rrf_k: 60
  fusion: rrf
embeddings:
  batch_size: 32
  cache_file: embeddings_v1.npy
reranker:
  enabled: true
  model: cross-encoder/ms-marco-MiniLM-L-6-v2