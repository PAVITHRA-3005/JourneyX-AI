# Copy to credentials.local.yaml and fill keys (file is gitignored).
# CA certs: place under certs/ (vm05 for chat, vm02 for embeddings per coordinator guide).

chat:
  api_base: https://103.42.50.41:1033/v1
  api_key: YOUR_GROUP_CHAT_API_KEY
  model: Qwen/Qwen3-8B
  ca_cert: certs/vm05-ca.crt
